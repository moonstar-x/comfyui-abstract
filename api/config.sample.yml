workflows:
  - alias: krea2
    workflow: generate-image-krea2
    type: generate-image
    params:
      visible:
        - positivePrompt
        - width
        - height
      advanced:
        - negativePrompt
        - seed
        - steps
        - cfg
        - sampler
        - scheduler
        - loras
      defaults:
        width: 1024
        height: 1024
        negativePrompt: ''
        steps: 8
        cfg: 1
        sampler: euler
        scheduler: simple
        loras: []
    serverParams:
      model: krea2.safetensors
      clip: qwen3vl_4b_fp8_scaled.safetensors
      vae: qwen_image_vae.safetensors
  - alias: qwen-image-2.1
    workflow: image-edit-qwen-image-2.1
    type: image-edit
    params:
      visible:
        - images
        - positivePrompt
      advanced:
        - negativePrompt
        - seed
        - steps
        - cfg
        - sampler
        - scheduler
      defaults:
        negativePrompt: ''
        steps: 25
        cfg: 1
        sampler: euler
        scheduler: simple
    serverParams:
      model: qwen_image_2.1_int8_convrot.safetensors
      clip: qwen3vl_8b_int8_convrot.safetensors
      vae: qwen_image_2.1_vae_bf16.safetensors

name: '#Callable - (global): Filter Paths'

on:
  workflow_call:
    outputs:
      api:
        value: ${{ jobs.filter.outputs.api }}
        description: Whether changes in api were found.
      ui:
        value: ${{ jobs.filter.outputs.ui }}
        description: Whether changes in ui were found.

jobs:
  filter:
    name: Filter Paths
    runs-on: ubuntu-latest

    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Filter Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            ui:
              - 'ui/**'
